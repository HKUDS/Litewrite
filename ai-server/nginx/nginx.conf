# ==============================================================================
# Litewrite AI Server - Nginx 配置
# ==============================================================================
# 负载均衡配置，支持 SSE 长连接
#
# 使用方法：
#   复制到 /etc/nginx/conf.d/ 或在 docker-compose 中挂载
# ==============================================================================

# 上游服务器组（AI Server 实例）
upstream ai_server {
    # 负载均衡策略
    # - round_robin: 轮询（默认）
    # - least_conn: 最少连接
    # - ip_hash: IP 哈希（会话保持）
    least_conn;

    # AI Server 实例
    # 使用 Docker Compose 服务名，Docker 内置 DNS 会自动负载均衡到所有实例
    # 扩展命令: docker-compose up -d --scale ai-server=4
    server ai-server:6612 max_fails=3 fail_timeout=30s;

    # 保持连接
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 日志
    access_log /var/log/nginx/ai-server-access.log;
    error_log /var/log/nginx/ai-server-error.log;

    # 客户端请求限制
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 代理缓冲区
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ==================== 健康检查端点 ====================

    location /health {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 健康检查超时较短
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ==================== Metrics 端点 ====================

    location /metrics {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==================== SSE 端点（长连接） ====================
    # Chat、DeepResearch 等使用 SSE 流式输出

    location ~ ^/api/(chat|deep-research|ai-draw|ai-table) {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;

        # 请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需配置
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # 长连接超时（LLM 响应可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 传递用户 ID（用于限流）
        proxy_set_header X-User-ID $http_x_user_id;

        # 禁用 Nginx 缓冲，确保 SSE 实时传输
        chunked_transfer_encoding on;
    }

    # ==================== TAP 补全端点 ====================
    # 低延迟要求

    location /api/tap {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # TAP 需要快速响应
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 保持连接
        proxy_set_header Connection "keep-alive";
    }

    # ==================== 其他 API 端点 ====================

    location /api {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 标准超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # 保持连接
        proxy_set_header Connection "keep-alive";
    }

    # ==================== 文档端点 ====================
    # 仅开发环境启用

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://ai_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ==================== 根路径 ====================

    location / {
        return 404 '{"error": "Not Found", "message": "AI Server API - Use /api/* endpoints"}';
        default_type application/json;
    }
}
