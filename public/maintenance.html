<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litewrite - System Maintenance</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body[data-lang="zh"] {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Animated background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(80px);
      opacity: 0.5;
      animation: glowPulse 4s ease-in-out infinite;
    }

    .bg-glow-1 {
      top: -200px;
      left: -100px;
    }

    .bg-glow-2 {
      bottom: -300px;
      right: -150px;
      animation-delay: -2s;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 3rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon img {
      width: 48px;
      height: 48px;
    }

    .logo-text {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 100px;
      padding: 8px 20px;
      margin-bottom: 2rem;
      font-size: 0.875rem;
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: statusPulse 1.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { opacity: 0.6; box-shadow: 0 0 0 8px transparent; }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .eta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .eta-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Decorative elements */
    .floating-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
    .particle:nth-child(2) { left: 20%; animation-delay: -2s; animation-duration: 14s; }
    .particle:nth-child(3) { left: 35%; animation-delay: -4s; animation-duration: 16s; }
    .particle:nth-child(4) { left: 50%; animation-delay: -6s; animation-duration: 13s; }
    .particle:nth-child(5) { left: 65%; animation-delay: -8s; animation-duration: 15s; }
    .particle:nth-child(6) { left: 80%; animation-delay: -10s; animation-duration: 11s; }
    .particle:nth-child(7) { left: 90%; animation-delay: -12s; animation-duration: 17s; }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 640px) {
      h1 {
        font-size: 1.75rem;
      }

      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>

  <script>
    // Static maintenance page (English only)
    document.documentElement.lang = "en";
    document.body.setAttribute("data-lang", "en");
    document.title = "Litewrite - System Maintenance";

    // Poll the service and redirect when it is back
    function checkServiceStatus() {
      fetch('/health', { method: 'HEAD', cache: 'no-store' })
        .then(response => {
          if (response.ok) {
            window.location.replace('/');
          } else {
            setTimeout(checkServiceStatus, 30000);
          }
        })
        .catch(() => {
          setTimeout(checkServiceStatus, 30000);
        });
    }

    // Start polling after 30 seconds
    setTimeout(checkServiceStatus, 30000);
  </script>
